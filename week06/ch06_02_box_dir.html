<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CSS Property Basic</title>
    <style>
        div {
            width: 100px; height: 100px;
            background-color: red;
            display: inline-block;
        }
        .four {
            /* margin: 위쪽 오른쪽 아래쪽 왼쪽 */
            margin: 0 30px 0 30px;
            padding: 0 30px 0 30px;
        }
        .two {
            /* margin: <위아래> <왼쪽오른쪽> */
            margin: 0 30px;
            padding: 0 30px;
        }
    </style>
</head>
<body>
    <div class="four">4방향</div>
    <div class="two">2방향</div>
</body>
</html>
