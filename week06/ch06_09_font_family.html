<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CSS3 Font Property</title>
    <style>
        .font_arial { font-family: '없는 글꼴', Arial; }
        .font_roman { font-family: 'Times New Roman', Arial; }
        .sans { font-family: '없는 글꼴', sans-serif; }
        .serif { font-family: '없는 글꼴', serif; }
    </style>
</head>
<body>
    <h1 class="font_arial">Lorem ipsum (Arial)</h1>
    <p class="font_roman">Lorem ipsum (Times New Roman)</p>
    <h1 class="sans">Lorem ipsum (sans-serif)</h1>
    <h1 class="serif">Lorem ipsum (serif)</h1>
</body>
</html>
