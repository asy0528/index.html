<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CSS3 Property Basic</title>
    <style>
        .box {
            border-width: thick;
            border-style: dashed;
            border-color: black;
        }
        .round { border-radius: 20px; }
        .each {
            /* "왼쪽 위" "오른쪽 위" "오른쪽 아래" "왼쪽 아래" */
            border-radius: 50px 40px 20px 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Lorem ipsum dolor amet</h1>
    </div>
    <br>
    <div class="box round">
        <h1>Lorem ipsum dolor amet</h1>
    </div>
    <br>
    <div class="box each">
        <h1>Lorem ipsum dolor amet</h1>
    </div>
</body>
</html>
