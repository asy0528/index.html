<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>flex 빨간 박스</title>
    <style>
      /* CSS: 부모에게 flex 지시 */
      .container {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      /* 박스 칸을 빨간색으로 */
      .container div {
        background-color: red;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <!-- HTML: 박스 3개를 감싸는 부모 -->
    <div class="container">
      <div>박스1</div>
      <div>박스2</div>
      <div>박스3</div>
    </div>
  </body>
</html>
